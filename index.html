<script>
        // TARGET DATE: September 30, 2026 00:00:00
        const targetDate = new Date("September 30, 2026 00:00:00").getTime();

        const countdownSection = document.getElementById("countdown-section");
        const heartBlast = document.getElementById("heart-blast");
        const videoSection = document.getElementById("video-section");
        const anniversaryVideo = document.getElementById("anniversary-video");
        const playBtn = document.getElementById("play-btn");
        const completionSection = document.getElementById("completion-section");

        // Update countdown timer every second
        const timerInterval = setInterval(() => {
            const now = new Date().getTime();
            const difference = targetDate - now;

            if (difference <= 0) {
                clearInterval(timerInterval);
                if (countdownSection.style.display !== "none") {
                    triggerBigHeartBlast();
                }
                return;
            }

            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = String(days).padStart(2, '0');
            document.getElementById("hours").innerText = String(hours).padStart(2, '0');
            document.getElementById("minutes").innerText = String(minutes).padStart(2, '0');
            document.getElementById("seconds").innerText = String(seconds).padStart(2, '0');
        }, 1000);

        // Check on load if date has already passed
        window.addEventListener("DOMContentLoaded", () => {
            if (new Date().getTime() >= targetDate) {
                countdownSection.style.display = "none";
                triggerBigHeartBlast();
            }
        });

        function triggerBigHeartBlast() {
            gsap.to(countdownSection, { opacity: 0, duration: 0.5, onComplete: () => {
                countdownSection.style.display = "none";
                heartBlast.classList.remove("hidden");
                
                gsap.to(heartBlast, { opacity: 1, duration: 0.3 });
                setTimeout(() => {
                    gsap.to(heartBlast, { opacity: 0, duration: 0.5, onComplete: () => {
                        heartBlast.classList.add("hidden");
                        launchVideoPlayer();
                    }});
                }, 1200);
            }});
        }

        function launchVideoPlayer() {
            videoSection.classList.remove("hidden");
            gsap.to(videoSection, { opacity: 1, duration: 1 });
            
            anniversaryVideo.currentTime = 0;
            
            // Attempt to play and catch browser autoplay restrictions
            let playPromise = anniversaryVideo.play();
            if (playPromise !== undefined) {
                playPromise.catch(() => {
                    // Autoplay was blocked: explicitly show the play button
                    playBtn.classList.remove("hidden");
                });
            }
        }

        function startVideoPlayback() {
            playBtn.classList.add("hidden");
            anniversaryVideo.play();
        }

        // When video ends, transition smoothly to the completion/proposal text screen
        anniversaryVideo.addEventListener("ended", () => {
            gsap.to(videoSection, { opacity: 0, duration: 1, onComplete: () => {
                videoSection.classList.add("hidden");
                completionSection.classList.remove("hidden");
                gsap.to(completionSection, { opacity: 1, duration: 1 });
            }});
        });

        function replayExperience() {
            gsap.to(completionSection, { opacity: 0, duration: 0.5, onComplete: () => {
                completionSection.classList.add("hidden");
                launchVideoPlayer();
            }});
        }
    </script>
